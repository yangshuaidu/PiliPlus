name: Check live interactions

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Format live settings changes
        shell: pwsh
        run: |
          $paths = @(git diff-tree --no-commit-id --name-only -r HEAD -- '*.dart' | Where-Object { Test-Path -LiteralPath $_ })
          New-Item -ItemType File -Path live-format.patch | Out-Null
          if ($paths.Count -gt 0) {
            dart format @paths
            $formatExit = $LASTEXITCODE
            git diff --output=live-format.patch -- @paths
            if ($formatExit -ne 0) { exit $formatExit }
          }
      - name: Install preview font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Analyze and test
        env:
          LIVE_UI_CAPTURE: '1'
          CJK_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        shell: pwsh
        run: tool/check_live.ps1
      - name: Upload mobile layout previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-mobile-layout-previews
          path: build/live-ui/*.png
          if-no-files-found: ignore
      - name: Upload formatting patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: live-format.patch
          path: live-format.patch
